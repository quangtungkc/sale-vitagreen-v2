name: Build macOS application

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the macOS file to
        required: true
        default: v2.8.0

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: package
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec electron-builder --mac zip --x64 2>&1 | tee build.log
      - name: Show build diagnostics
        if: steps.package.outcome == 'failure'
        run: |
          echo '### Lỗi đóng gói macOS' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Upload to GitHub Release
        if: steps.package.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*.zip
